<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ポーカーのドロー確率を2択で鍛える、10問の暗算ドリル。"
    />
    <title>暗算ポーカー</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="src/question-bank.js"></script>
    <script src="src/game.js"></script>
    <script src="src/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <p id="app-error" class="error" role="alert" hidden></p>

      <section id="landing" class="screen landing-screen" aria-labelledby="app-title">
        <div class="brand-lockup">
          <div
            id="logo-cards"
            class="logo-cards"
            aria-hidden="true"
          ></div>
          <h1 id="app-title">暗算ポーカー</h1>
        </div>
        <button id="start-game" class="primary-action start-action" type="button">
          はじめる
        </button>
      </section>

      <section id="game" class="screen game-screen" aria-labelledby="prompt" hidden>
        <header class="quiz-header">
          <button id="leave-game" class="icon-button" type="button" aria-label="トップへ戻る">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 5-7 7 7 7" />
            </svg>
          </button>
          <div
            id="progress"
            class="progress-track"
            role="progressbar"
            aria-label="問題の進み具合"
            aria-valuemin="1"
            aria-valuemax="10"
            aria-valuenow="1"
          >
            <span id="progress-fill" class="progress-fill"></span>
          </div>
        </header>

        <div class="question-content">
          <h2 id="prompt" class="prompt" tabindex="-1"></h2>

          <div class="table-area">
            <div
              id="board-cards"
              class="board-lane"
              role="group"
              aria-label="コミュニティカード"
            ></div>

            <section class="hand-area" aria-labelledby="hole-label">
              <div
                id="hole-cards"
                class="hand-cards"
                role="group"
                aria-label="手札"
              ></div>
              <p id="hole-label" class="hand-label">手札</p>
            </section>
          </div>

          <div id="choices" class="choices" aria-label="選択肢"></div>
        </div>

        <section
          id="feedback"
          class="answer-sheet"
          aria-live="polite"
          aria-labelledby="feedback-title"
          hidden
        >
          <span class="sheet-handle" aria-hidden="true"></span>
          <div id="feedback-mark" class="answer-mark" aria-hidden="true">
            <svg class="answer-icon answer-icon-check" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="20" />
              <path d="m15 24 6 6 13-14" />
            </svg>
            <svg class="answer-icon answer-icon-cross" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="20" />
              <path d="m17 17 14 14m0-14L17 31" />
            </svg>
          </div>
          <p id="feedback-title" class="feedback-title"></p>
          <p id="actual-probability" class="actual-probability"></p>
          <p id="explanation" class="explanation"></p>
          <button id="next-question" class="primary-action next-action" type="button"></button>
        </section>
      </section>

      <section id="result" class="screen result-screen" aria-labelledby="result-title" hidden>
        <div class="result-content">
          <h2 id="result-title">結果</h2>
          <p id="score" class="score"></p>
        </div>
        <div class="result-actions">
          <button id="retry" class="primary-action" type="button">もう一度</button>
          <button id="back-home" class="secondary-action" type="button">トップへ</button>
        </div>
      </section>
    </main>
  </body>
</html>
